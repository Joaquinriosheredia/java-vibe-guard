name: 'java-vibe-guard'
description: 'Detect vibe coding anti-patterns in Java/Spring Boot projects before they reach production'
author: 'Joaquin Rios Heredia'

branding:
  icon: 'shield'
  color: 'red'

# ─── Inputs ───────────────────────────────────────────────────────────────────

inputs:
  path:
    description: 'Path to the Java/Spring Boot project to scan (relative to workspace root)'
    required: false
    default: '.'

  rule:
    description: 'Run only one rule: blocking | layers | kafka | transactions | observability'
    required: false
    default: ''

  ignore:
    description: 'Comma-separated directory names to exclude (e.g. labs,demos,legacy)'
    required: false
    default: ''

  fail-on:
    description: 'Fail the step when: critical (default) | never'
    required: false
    default: 'critical'

  upload-report:
    description: 'Upload the JSON report as a workflow artifact'
    required: false
    default: 'true'

  sarif:
    description: 'Generate a SARIF report and upload it to GitHub Code Scanning (opt-in)'
    required: false
    default: 'false'

# ─── Outputs ──────────────────────────────────────────────────────────────────

outputs:
  critical:
    description: 'Number of CRITICAL issues found'
    value: ${{ steps.scan.outputs.critical }}

  major:
    description: 'Number of MAJOR issues found'
    value: ${{ steps.scan.outputs.major }}

  warning:
    description: 'Number of WARNING issues found'
    value: ${{ steps.scan.outputs.warning }}

  healthy:
    description: '"true" when no CRITICAL issues were found'
    value: ${{ steps.scan.outputs.healthy }}

  report-json:
    description: 'Absolute path to the JSON report file on the runner'
    value: ${{ steps.scan.outputs.report-json }}

  report-sarif:
    description: 'Absolute path to the SARIF report file on the runner (only set when the sarif input is true)'
    value: ${{ steps.sarif.outputs.report-sarif }}

# ─── Steps ────────────────────────────────────────────────────────────────────

runs:
  using: composite
  steps:

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install CLI dependencies
      shell: bash
      run: npm ci --prefix "${{ github.action_path }}/cli"

    - name: Scan
      id: scan
      shell: bash
      env:
        VG_PATH:    ${{ inputs.path }}
        VG_RULE:    ${{ inputs.rule }}
        VG_IGNORE:  ${{ inputs.ignore }}
        VG_FAIL_ON: ${{ inputs.fail-on }}
        CLI:        ${{ github.action_path }}/cli/bin/cli.js
      run: |
        REPORT="$RUNNER_TEMP/vibe-guard-report.json"

        # Build arg array — avoids quoting pitfalls with env vars
        ARGS=("$VG_PATH" "--json")
        [[ -n "$VG_RULE"   ]] && ARGS+=("--rule"   "$VG_RULE")
        [[ -n "$VG_IGNORE" ]] && ARGS+=("--ignore" "$VG_IGNORE")

        # Run CLI: capture exit status without letting set -e abort the script.
        # The shell runs with -e -o pipefail; a non-zero CLI exit (CRITICAL findings)
        # would abort before we can write $GITHUB_OUTPUT. set +e disables that locally.
        set +e
        node "$CLI" "${ARGS[@]}" | tee "$REPORT"
        SCAN_EXIT=${PIPESTATUS[0]}
        set -e

        # Extract per-severity counts and healthy flag from stable JSON contract
        CRITICAL=$(jq '.summary.critical' "$REPORT")
        MAJOR=$(jq    '.summary.major'    "$REPORT")
        WARNING=$(jq  '.summary.warning'  "$REPORT")
        HEALTHY=$(jq  -r '.healthy'       "$REPORT")

        # Expose outputs to subsequent steps / caller workflows
        echo "critical=$CRITICAL"  >> "$GITHUB_OUTPUT"
        echo "major=$MAJOR"        >> "$GITHUB_OUTPUT"
        echo "warning=$WARNING"    >> "$GITHUB_OUTPUT"
        echo "healthy=$HEALTHY"    >> "$GITHUB_OUTPUT"
        echo "report-json=$REPORT" >> "$GITHUB_OUTPUT"

        # Write a markdown summary visible in the Actions UI
        {
          echo "## java-vibe-guard"
          echo ""
          if [[ "$HEALTHY" == "true" ]]; then
            echo "✅ **No CRITICAL issues** — production-ready"
          else
            echo "🚨 **$CRITICAL CRITICAL issue(s)** — must fix before deploying"
          fi
          echo ""
          echo "| Severity | Count |"
          echo "|----------|------:|"
          echo "| 🔴 CRITICAL | $CRITICAL |"
          echo "| 🟡 MAJOR    | $MAJOR |"
          echo "| ⚠️ WARNING  | $WARNING |"
        } >> "$GITHUB_STEP_SUMMARY"

        # Apply fail-on policy
        if [[ "$VG_FAIL_ON" == "critical" && $SCAN_EXIT -eq 1 ]]; then
          echo "::error::java-vibe-guard: $CRITICAL CRITICAL issue(s) found — fix before merging"
          exit 1
        fi

    - name: Upload report artifact
      if: ${{ always() && inputs.upload-report == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: vibe-guard-report
        path: ${{ steps.scan.outputs.report-json }}
        retention-days: 30

    - name: Generate SARIF report
      id: sarif
      if: ${{ always() && inputs.sarif == 'true' }}
      shell: bash
      # VG_PATH/VG_RULE/VG_IGNORE are recomputed from inputs.* here rather than
      # reused from the Scan step above — composite action steps do not share
      # env vars with each other (a step's `env:` is scoped to that step's own
      # `run` only), so there is no way to "reuse" Scan's copies. This is a
      # duplication of Scan's env block (lines ~88-91), not an independent
      # definition: if the input-defaulting/plumbing logic there ever changes
      # (new input, renamed var, different default handling), it must be
      # replicated here by hand — nothing enforces the two blocks staying in
      # sync automatically.
      env:
        VG_PATH:   ${{ inputs.path }}
        VG_RULE:   ${{ inputs.rule }}
        VG_IGNORE: ${{ inputs.ignore }}
        CLI:       ${{ github.action_path }}/cli/bin/cli.js
      run: |
        SARIF_REPORT="$RUNNER_TEMP/vibe-guard-report.sarif"

        ARGS=("$VG_PATH" "--format" "sarif")
        [[ -n "$VG_RULE"   ]] && ARGS+=("--rule"   "$VG_RULE")
        [[ -n "$VG_IGNORE" ]] && ARGS+=("--ignore" "$VG_IGNORE")

        # Exit code 1 here is ambiguous by itself: it means either "critical
        # findings were found" (normal, expected — same as the Scan step's
        # --json run) OR "sarif.js/scanner.js crashed with an uncaught
        # exception" (a real bug). Node's default handler exits 1 in both
        # cases, so the exit code alone cannot distinguish them. `|| true`
        # only stops this step's `-e` from aborting the script on the first
        # (expected) case — it is NOT the real pass/fail gate for this step.
        # The actual gate is the file-content check below, which fails loudly
        # on a missing/corrupt report regardless of what the exit code was.
        node "$CLI" "${ARGS[@]}" > "$SARIF_REPORT" || true

        if [[ ! -s "$SARIF_REPORT" ]] || ! jq empty "$SARIF_REPORT" 2>/dev/null; then
          echo "::error::java-vibe-guard: SARIF generation produced no output or invalid JSON — this indicates a bug in the SARIF writer, not a scan finding. Check the step logs above for the underlying error." >&2
          exit 1
        fi

        echo "report-sarif=$SARIF_REPORT" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF to GitHub Code Scanning
      # steps.sarif.outcome == 'success' guards against the Generate SARIF
      # report step's own failure mode (missing/corrupt report, see the file
      # check above): without this, always() would still try to run this
      # step and upload an empty/undefined sarif_file, producing a second,
      # confusing failure instead of cleanly skipping.
      if: ${{ always() && inputs.sarif == 'true' && steps.sarif.outcome == 'success' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.sarif.outputs.report-sarif }}
