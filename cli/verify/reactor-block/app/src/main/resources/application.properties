# Thread pools are fixed by JVM system properties in run-experiment.sh (reactor.netty.*,
# reactor.schedulers.*), not here: Reactor reads them when its classes load.
spring.main.banner-mode=off
spring.threads.virtual.enabled=false
server.port=8080
server.tomcat.threads.max=200
logging.level.root=WARN
experiment.downstream-url=http://localhost:8081
