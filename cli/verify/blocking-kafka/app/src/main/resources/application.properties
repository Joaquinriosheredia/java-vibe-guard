# Variants change only b, max.poll.records and max.poll.interval.ms (PREREGISTRATION.md),
# via command-line properties. Everything else is the spring-kafka / kafka-clients default:
# AckMode BATCH, enable.auto.commit=false, session.timeout.ms 45 s, heartbeat 3 s.
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.threads.virtual.enabled=false
spring.kafka.consumer.auto-offset-reset=earliest
logging.level.root=WARN
